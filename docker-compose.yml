# Local run: `docker compose up --build`, then open http://localhost:8000
services:
  routepass:
    build: .
    container_name: routepass
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ROUTEPASS_BASE_URL: http://localhost:8000
      ROUTEPASS_LOCAL_API_TOKEN: ${ROUTEPASS_LOCAL_API_TOKEN:-}
      ROUTEPASS_API_TOKEN: ${ROUTEPASS_API_TOKEN:-}
      ROUTEPASS_STRAVA_CLIENT_ID: ${ROUTEPASS_STRAVA_CLIENT_ID:-}
      ROUTEPASS_STRAVA_CLIENT_SECRET: ${ROUTEPASS_STRAVA_CLIENT_SECRET:-}
    volumes:
      - routepass-data:/data
volumes:
  routepass-data:
