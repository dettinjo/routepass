name: Build and deploy

# Builds the single RoutePass image (API + MCP + web UI) and pushes it to GHCR. On main the
# deploy job calls the signed Komodo webhook for the `routepass-local` stack
# (dettinjo/homelab: stacks/home/routepass-local), which pulls :latest and recreates it.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/routepass
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Komodo (signed webhook → pull + redeploy stack "routepass-local")
        env:
          SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          body=$(printf '{"ref":"refs/heads/main","after":"%s","repository":{"full_name":"%s"}}' "$GITHUB_SHA" "$GITHUB_REPOSITORY")
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $NF}')"
          code=$(curl -s -o /tmp/resp -w '%{http_code}' --max-time 30 -X POST \
            "https://hooks.joeldettinger.de/listener/github/stack/routepass-local/deploy" \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: $sig" --data "$body")
          cat /tmp/resp; echo; echo "HTTP $code"
          [ "$code" -lt 300 ]
